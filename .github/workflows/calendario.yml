name: Calendario economico

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas (UTC)
  workflow_dispatch:          # botao "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar calendario do ForexFactory
        run: |
          for w in thisweek nextweek; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o tmp.json -w "%{http_code}" "https://nfs.faireconomy.media/ff_calendar_${w}.json" || echo 000)
              echo "$w tentativa $i: HTTP $code"
              if [ "$code" = "200" ] && python3 -c "import json; d=json.load(open('tmp.json')); assert isinstance(d, list) and d"; then
                mv tmp.json "ff_${w}.json"; echo "$w OK"; break
              fi
              rm -f tmp.json
              if [ "$code" = "404" ]; then echo "$w ainda nao publicada"; break; fi
              sleep 90
            done
          done
          ls -la

      - name: Salvar no repositorio
        run: |
          git config user.name "calendario-bot"
          git config user.email "calendario-bot@users.noreply.github.com"
          git add ff_*.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "sem mudancas"; else git commit -m "calendario $(date -u '+%Y-%m-%d %H:%M') UTC" && git push; fi
